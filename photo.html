
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editora Studio — Photo Editor</title>
<style>
:root{--bg:#0c0e14;--panel:#171b26;--panel2:#202636;--line:#30394c;--txt:#f4f5fa;--muted:#a4aec2;--accent:#927cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:10px 13px;border-radius:9px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent);background:#30364b}
button.active,.primary{background:#7058d8;border-color:#927cff}
button:disabled{opacity:.4;cursor:not-allowed}
header{height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.logo{font-size:19px;font-weight:bold;color:#b7aaff;white-space:nowrap}
.head-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.app{height:calc(100dvh - 60px);min-height:550px;display:flex;flex-direction:column}
.toolrail{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.toolrail button{min-width:88px}
.workarea{flex:1;min-height:0;display:flex;flex-direction:column}
.preview-area{height:55%;min-height:220px;flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:12px;background:#090b10;overflow:hidden}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#canvas{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;box-shadow:0 5px 35px #0009}
.empty{text-align:center;color:var(--muted);line-height:1.7}
.empty h2{color:white}
.bottom{height:45%;min-height:210px;max-height:390px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
.panel-head{padding:11px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.panel-head strong{color:#c7bdff}
.panel-body{padding:14px;overflow:auto;flex:1}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.preset{padding:5px;text-align:center;font-size:12px}
.preset img{width:100%;height:72px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px;background:#080a0e}
.preset.active{outline:2px solid var(--accent)}
.control{min-width:160px;flex:1;margin:5px 0 12px}
.control label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{height:36px;width:100%;background:transparent;border:0}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0e121b;color:white}
textarea{min-height:70px}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.layer{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px;background:var(--panel2);border-radius:8px;margin:6px 0}
.status{font-size:12px;color:#b8adff;padding:6px 14px;background:#111520}
.hidden{display:none!important}
@media(max-width:650px){
 header{height:auto;min-height:58px;padding:9px;align-items:flex-start;flex-direction:column}
 .app{height:calc(100dvh - 95px)}
 .logo{font-size:17px}
 .head-actions{width:100%}
 .head-actions button,.head-actions label{flex:1;text-align:center;padding:9px 5px;font-size:12px}
 .preview-area{height:48%;min-height:180px}
 .bottom{height:52%;max-height:none}
 .toolrail{padding:8px}
 .toolrail button{min-width:82px;padding:9px 8px;font-size:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr))}
}
</style>
</head>
<body>
<header>
 <div class="logo">✦ EDITORA STUDIO</div>
 <div class="head-actions">
  <label class="btn primary" for="upload">＋ Upload Photo</label>
  <input id="upload" type="file" accept="image/*" hidden>
  <button id="undo">↶ Undo</button><button id="redo">↷ Redo</button>
  <button id="reset">Reset</button><button id="save">Save Project</button>
  <button id="open">Open Project</button><button id="export" class="primary">Export</button>
 </div>
</header>

<div class="app">
 <nav class="toolrail" id="toolrail">
  <button data-tool="adjust" class="active">Adjust</button>
  <button data-tool="filters">Filters</button>
  <button data-tool="effects">Effects</button>
  <button data-tool="crop">Crop & Size</button>
  <button data-tool="draw">Brush</button>
  <button data-tool="text">Text</button>
  <button data-tool="stickers">Stickers</button>
  <button data-tool="frames">Frames</button>
  <button data-tool="background">Background</button>
  <button data-tool="layers">Layers</button>
  <button data-tool="ai">AI Studio</button>
 </nav>

 <main class="workarea">
  <section class="preview-area">
   <div class="stage">
    <div class="empty" id="empty"><h2>Your creative workspace</h2><p>Upload a photo to start editing.</p><label class="btn primary" for="upload">Choose Photo</label></div>
    <canvas id="canvas" class="hidden"></canvas>
   </div>
  </section>
  <section class="bottom">
   <div class="panel-head"><strong id="panelTitle">ADJUSTMENTS</strong><div class="row"><button id="before">Before</button><button id="after">After</button></div></div>
   <div class="panel-body" id="panel"><p class="small">Upload a photo and choose a tool.</p></div>
  </section>
  <div class="status" id="status">Ready · Upload a photo to begin.</div>
 </main>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let img=null,tool='adjust',showBefore=false,drawMode='brush',brushColor='#ffffff',brushSize=12;
let S,undoStack=[],redoStack=[];
const defaults=()=>({brightness:100,contrast:100,saturation:100,warmth:0,hue:0,blur:0,exposure:0,
 rotation:0,flipH:false,flipV:false,crop:null,bg:'#ffffff',texts:[],stickers:[],strokes:[],frame:'none',filter:'Original'});
S=defaults();
const filters=[
 ['Original','none'],['B&W','grayscale(1)'],['Noir','grayscale(1) contrast(1.4)'],['Sepia','sepia(1)'],
 ['Vintage','sepia(.45) contrast(.9)'],['Warm','sepia(.2) saturate(1.35)'],['Cool','hue-rotate(180deg) saturate(.8)'],
 ['Dramatic','contrast(1.45) saturate(1.25)'],['Fade','contrast(.8) brightness(1.12)'],['Bright','brightness(1.2)'],
 ['Vivid','saturate(1.8)'],['Matte','contrast(.85) brightness(1.08)'],['Retro','sepia(.3) saturate(1.4)'],
 ['Cinematic','contrast(1.25) saturate(.8)'],['Soft','brightness(1.08) contrast(.9)'],['Emerald','hue-rotate(65deg) saturate(1.2)'],
 ['Rose','hue-rotate(325deg) saturate(1.25)'],['Golden','sepia(.3) saturate(1.5)'],
 ['Ice','hue-rotate(185deg) brightness(1.08)'],['Dream','brightness(1.15) saturate(.75)']
];
const effects=[
 ['None','none'],['Soft Blur','blur(2px)'],['Dream Glow','brightness(1.15) blur(.5px)'],
 ['High Contrast','contrast(1.5)'],['Soft Light','brightness(1.12) contrast(.9)'],
 ['Faded','opacity(.8)'],['Mono','grayscale(1)'],['Sepia Tone','sepia(.8)'],
 ['Color Pop','saturate(2)'],['Vintage Film','sepia(.35) contrast(1.15)'],
 ['Cool Shadow','hue-rotate(190deg)'],['Warm Glow','sepia(.2) brightness(1.1)'],
 ['Invert','invert(1)'],['Poster','contrast(1.8) saturate(1.6)'],
 ['Night','brightness(.65) saturate(.8)'],['Pastel','saturate(.65) brightness(1.12)']
];
let selectedEffect='none';
function status(t){$('status').textContent=t}
function snapshot(){
 if(!img)return;
 undoStack.push(JSON.stringify(S));
 if(undoStack.length>30)undoStack.shift();
 redoStack=[];
}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(S));S=JSON.parse(undoStack.pop());renderImage();panel()}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(S));S=JSON.parse(redoStack.pop());renderImage();panel()}
function load(src){
 const im=new Image();
 im.onload=()=>{
  img=im;canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;
  S=defaults();undoStack=[];redoStack=[];
  $('empty').classList.add('hidden');canvas.classList.remove('hidden');
  showBefore=false;renderImage();panel();status('Photo loaded successfully');
 };
 im.onerror=()=>status('Could not open this image. Try another image.');
 im.src=src;
}
$('upload').addEventListener('change',e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){status('Choose a valid image');return}
 const reader=new FileReader();
 reader.onload=()=>load(reader.result);
 reader.onerror=()=>status('Could not read this image');
 reader.readAsDataURL(f);
 e.target.value='';
});
function renderImage(){
 if(!img)return;
 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);
 ctx.fillStyle=S.bg;ctx.fillRect(0,0,w,h);
 if(showBefore){ctx.drawImage(img,0,0,w,h);return}
 let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
 if(S.crop){
  const ratio=S.crop;
  if(sw/sh>ratio){const nw=sh*ratio;sx=(sw-nw)/2;sw=nw}
  else{const nh=sw/ratio;sy=(sh-nh)/2;sh=nh}
 }
 ctx.save();
 ctx.translate(w/2,h/2);
 ctx.rotate(S.rotation*Math.PI/180);
 ctx.scale(S.flipH?-1:1,S.flipV?-1:1);
 ctx.filter=`brightness(${S.brightness}%) contrast(${S.contrast}%) saturate(${S.saturation}%) hue-rotate(${S.hue}deg) blur(${S.blur}px) ${selectedEffect}`;
 ctx.globalAlpha=1;
 ctx.drawImage(img,sx,sy,sw,sh,-w/2,-h/2,w,h);
 ctx.restore();ctx.filter='none';
 if(S.warmth){ctx.fillStyle=S.warmth>0?`rgba(255,145,45,${Math.abs(S.warmth)/500})`:`rgba(40,120,255,${Math.abs(S.warmth)/500})`;ctx.fillRect(0,0,w,h)}
 if(S.exposure){ctx.fillStyle=S.exposure>0?`rgba(255,255,255,${S.exposure/300})`:`rgba(0,0,0,${Math.abs(S.exposure)/300})`;ctx.fillRect(0,0,w,h)}
 S.strokes.forEach(s=>{
  if(s.visible===false||!s.points.length)return;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.size;ctx.strokeStyle=s.color;
  ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
  s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));if(s.points.length===1)ctx.lineTo(s.points[0].x+.1,s.points[0].y+.1);
  ctx.stroke();ctx.restore();
 });
 S.stickers.forEach(o=>{if(o.visible===false)return;ctx.font=`${o.size}px Arial`;ctx.textAlign='center';ctx.fillText(o.value,o.x,o.y)});
 S.texts.forEach(o=>{if(o.visible===false)return;ctx.font=`bold ${o.size}px ${o.font}`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle=o.outline||'#000000';ctx.strokeText(o.value,o.x,o.y);ctx.fillStyle=o.color;ctx.fillText(o.value,o.x,o.y)});
 if(S.frame!=='none'){ctx.save();ctx.strokeStyle=S.frame;ctx.lineWidth=Math.max(8,Math.min(w,h)*.025);ctx.strokeRect(8,8,w-16,h-16);ctx.restore()}
}
function slider(label,key,min,max,step=1){
 return `<div class="control"><label>${label}<span id="val-${key}">${S[key]}</span></label><input type="range" data-range="${key}" min="${min}" max="${max}" step="${step}" value="${S[key]}"></div>`;
}
function presetGrid(items,type){
 return `<div class="grid">${items.map((item,i)=>`<button class="preset" data-preset="${type}:${i}"><img data-thumb="${type}:${i}" alt=""><span>${item[0]}</span></button>`).join('')}</div>`;
}
function makeThumbs(){
 document.querySelectorAll('[data-thumb]').forEach(el=>{
  const [type,n]=el.dataset.thumb.split(':');const list=type==='filter'?filters:effects;
  if(!img)return;
  const t=document.createElement('canvas');t.width=120;t.height=75;
  const c=t.getContext('2d');c.filter=type==='filter'?list[n][1]:list[n][1];
  c.drawImage(img,0,0,120,75);el.src=t.toDataURL();
 });
}
function panel(){
 const p=$('panel');$('panelTitle').textContent=tool.toUpperCase();
 if(!img){p.innerHTML='<p class="small">Upload a photo first.</p>';return}
 if(tool==='adjust'){
  p.innerHTML='<div class="row">'+slider('Brightness','brightness',0,200)+slider('Contrast','contrast',0,200)+slider('Saturation','saturation',0,200)+'</div><div class="row">'+slider('Warmth','warmth',-100,100)+slider('Hue','hue',-180,180)+slider('Blur','blur',0,20,.5)+slider('Exposure','exposure',-100,100)+'</div>';
 }else if(tool==='filters'){
  p.innerHTML='<p class="small">Tap a thumbnail to preview and apply. More preset styles are included in the library.</p>'+presetGrid(filters,'filter');
 }else if(tool==='effects'){
  p.innerHTML='<p class="small">Choose an effect preview. Combine with adjustments for your own look.</p>'+presetGrid(effects,'effect');
 }else if(tool==='crop'){
  p.innerHTML='<p class="small">Crop uses a centered aspect ratio. Original keeps the current ratio.</p><div class="row">'+['Original','1:1','4:5','3:2','16:9','9:16','5:4','2:3'].map(x=>`<button data-crop="${x}">${x}</button>`).join('')+'</div><div class="row" style="margin-top:12px"><div class="control"><label>Resize width</label><input id="rw" type="number" min="1" max="8000" placeholder="Width"></div><div class="control"><label>Resize height</label><input id="rh" type="number" min="1" max="8000" placeholder="Height"></div><button id="resize">Apply Resize</button></div><div class="row"><button id="rotL">Rotate Left</button><button id="rotR">Rotate Right</button><button id="flipH">Flip H</button><button id="flipV">Flip V</button></div>';
 }else if(tool==='draw'){
  p.innerHTML=`<div class="row"><button data-mode="brush" class="active">Brush</button><button data-mode="eraser">Eraser</button><div class="control"><label>Color</label><input id="brushColor" type="color" value="${brushColor}"></div><div class="control"><label>Size</label><input id="brushSize" type="range" min="1" max="120" value="${brushSize}"></div><button id="clearDraw">Clear strokes</button></div><p class="small">Draw on the photo using touch or mouse. Eraser removes brush strokes.</p>`;
 }else if(tool==='text'){
  p.innerHTML='<div class="row"><div class="control"><label>Text</label><input id="txt" placeholder="Type text"></div><div class="control"><label>Size</label><input id="txtSize" type="number" value="54" min="8" max="300"></div><div class="control"><label>Color</label><input id="txtColor" type="color" value="#ffffff"></div><div class="control"><label>Font</label><select id="font"><option>Arial</option><option>Georgia</option><option>Impact</option><option>Verdana</option><option>Courier New</option></select></div><button id="addText" class="primary">Add Text</button></div>';
 }else if(tool==='stickers'){
  p.innerHTML='<p class="small">Tap to add a sticker at the center. Add multiple stickers.</p><div class="grid">'+['❤️','⭐','✨','🔥','🌸','🌈','🎉','☀️','🌙','💎','🌺','🎯','🦋','🌻','🎈','💫','🍀','🌷','⚡','🎵'].map(x=>`<button data-sticker="${x}" style="font-size:23px">${x}</button>`).join('')+'</div>';
 }else if(tool==='frames'){
  p.innerHTML='<p class="small">Choose a simple frame color.</p><div class="grid">'+['#ffffff','#000000','#d4af37','#927cff','#ff4d6d','#25b7a5','#d7a07a','none'].map(x=>`<button data-frame="${x}" style="border:5px solid ${x==='none'?'#555':x};padding:18px">${x==='none'?'No Frame':'Apply'}</button>`).join('')+'</div>';
 }else if(tool==='background'){
  p.innerHTML=`<p class="small">Set the canvas color behind transparent areas. This does not automatically remove a photo background.</p><input id="bg" type="color" value="${S.bg}"><button id="applyBg">Apply color</button>`;
 }else if(tool==='layers'){
  const items=[...S.texts.map((o,i)=>({type:'text',i,name:o.value,visible:o.visible})),...S.stickers.map((o,i)=>({type:'sticker',i,name:o.value,visible:o.visible})),...S.strokes.map((o,i)=>({type:'stroke',i,name:'Brush stroke '+(i+1),visible:o.visible}))];
  p.innerHTML='<p class="small">Show or hide and delete added text, stickers and brush strokes.</p>'+(items.length?items.map(o=>`<div class="layer"><span>${o.name}</span><button data-layer-vis="${o.type}:${o.i}">${o.visible===false?'Show':'Hide'}</button><button data-layer-del="${o.type}:${o.i}">Delete</button></div>`).join(''):'<p class="small">No added layers yet.</p>');
 }else if(tool==='ai'){
  p.innerHTML='<p class="small">AI editing requires a secure server and an image AI API. This standalone browser page does not have that connection.</p><textarea placeholder="Describe your desired edit (prompt is not sent anywhere yet)" disabled></textarea><p class="small">Background removal, object removal, generative fill, face restoration and AI upscaling need backend integration.</p>';
 }
 wirePanel();if(tool==='filters'||tool==='effects')makeThumbs();
}
function wirePanel(){
 document.querySelectorAll('[data-range]').forEach(el=>el.oninput=()=>{
  S[el.dataset.range]=Number(el.value);const v=$('val-'+el.dataset.range);if(v)v.textContent=el.value;renderImage();
 });
 document.querySelectorAll('[data-preset]').forEach(el=>el.onclick=()=>{
  const [type,n]=el.dataset.preset.split(':');snapshot();
  if(type==='filter'){const f=filters[n];S.filter=f[0];selectedEffect='none';S.brightness=100;S.contrast=100;S.saturation=100;S.warmth=0;S.hue=0;selectedEffect=f[1]}
  else selectedEffect=effects[n][1];
  document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderImage();status('Preset applied: '+el.textContent.trim());
 });
 document.querySelectorAll('[data-crop]').forEach(el=>el.onclick=()=>{
  const v=el.dataset.crop;snapshot();S.crop=v==='Original'?null:({ '1:1':1,'4:5':.8,'3:2':1.5,'16:9':16/9,'9:16':9/16,'5:4':1.25,'2:3':2/3})[v];renderImage();status('Crop ratio applied');
 });
 if($('resize'))$('resize').onclick=()=>{
  const w=Number($('rw').value),h=Number($('rh').value);
  if(!w||!h||w>8000||h>8000)return status('Enter dimensions between 1 and 8000');
  snapshot();const temp=document.createElement('canvas');temp.width=w;temp.height=h;
  temp.getContext('2d').drawImage(canvas,0,0,w,h);
  const im=new Image();im.onload=()=>{img=im;canvas.width=w;canvas.height=h;S.crop=null;renderImage();status('Canvas resized')};im.src=temp.toDataURL();
 };
 if($('rotL'))$('rotL').onclick=()=>{snapshot();S.rotation=(S.rotation+270)%360;renderImage()};
 if($('rotR'))$('rotR').onclick=()=>{snapshot();S.rotation=(S.rotation+90)%360;renderImage()};
 if($('flipH'))$('flipH').onclick=()=>{snapshot();S.flipH=!S.flipH;renderImage()};
 if($('flipV'))$('flipV').onclick=()=>{snapshot();S.flipV=!S.flipV;renderImage()};
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{drawMode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
 if($('brushColor'))$('brushColor').oninput=e=>brushColor=e.target.value;
 if($('brushSize'))$('brushSize').oninput=e=>brushSize=Number(e.target.value);
 if($('clearDraw'))$('clearDraw').onclick=()=>{snapshot();S.strokes=[];renderImage()};
 if($('addText'))$('addText').onclick=()=>{
  const value=$('txt').value.trim();if(!value)return;
  snapshot();S.texts.push({value,x:canvas.width/2,y:canvas.height/2,size:Number($('txtSize').value)||54,color:$('txtColor').value,font:$('font').value,visible:true});renderImage();status('Text added');
 };
 document.querySelectorAll('[data-sticker]').forEach(b=>b.onclick=()=>{snapshot();S.stickers.push({value:b.dataset.sticker,x:canvas.width/2,y:canvas.height/2,size:70,visible:true});renderImage()});
 document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{snapshot();S.frame=b.dataset.frame;renderImage()});
 if($('bg'))$('bg').oninput=e=>S.bg=e.target.value;
 if($('applyBg'))$('applyBg').onclick=()=>{snapshot();S.bg=$('bg').value;renderImage()};
 document.querySelectorAll('[data-layer-vis]').forEach(b=>b.onclick=()=>{
  snapshot();const [t,i]=b.dataset.layerVis.split(':');const a=t==='text'?S.texts:t==='sticker'?S.stickers:S.strokes;a[i].visible=a[i].visible===false?true:false;renderImage();panel();
 });
 document.querySelectorAll('[data-layer-del]').forEach(b=>b.onclick=()=>{
  snapshot();const [t,i]=b.dataset.layerDel.split(':');const a=t==='text'?S.texts:t==='sticker'?S.stickers:S.strokes;a.splice(i,1);renderImage();panel();
 });
}
let drawing=false;
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{
 if(tool!=='draw'||!img)return;snapshot();drawing=true;const p=pos(e);
 S.strokes.push({points:[p],color:brushColor,size:brushSize,mode:drawMode,visible:true});canvas.setPointerCapture(e.pointerId);renderImage();
});
canvas.addEventListener('pointermove',e=>{
 if(!drawing)return;S.strokes[S.strokes.length-1].points.push(pos(e));renderImage();
});
function stopDraw(){drawing=false}
canvas.addEventListener('pointerup',stopDraw);canvas.addEventListener('pointercancel',stopDraw);

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
 tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));panel();
});
$('undo').onclick=undo;$('redo').onclick=redo;
$('reset').onclick=()=>{if(!img)return;snapshot();S=defaults();selectedEffect='none';renderImage();panel();status('Edits reset')};
$('before').onclick=()=>{showBefore=true;renderImage()};
$('after').onclick=()=>{showBefore=false;renderImage()};
$('export').onclick=()=>{
 if(!img)return status('Upload a photo first');
 const a=document.createElement('a');a.download='editora-photo.png';a.href=canvas.toDataURL('image/png');a.click();status('Photo exported as PNG');
};
$('save').onclick=()=>{
 if(!img)return status('Upload a photo first');
 try{const data={image:canvas.toDataURL('image/png'),settings:S};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='editora-project.json';a.click();URL.revokeObjectURL(a.href);status('Project file downloaded')}
 catch(e){status('Could not save project')}
};
$('open').onclick=()=>{
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=()=>{
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);load(d.image);const wait=()=>{if(!img)return;S=d.settings||defaults();renderImage();panel();status('Project opened')};setTimeout(wait,300)}catch(e){status('Invalid project file')}};
  r.readAsText(f);
 };input.click();
};
panel();
})();
</script>
</body>
</html>
