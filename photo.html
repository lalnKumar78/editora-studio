
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editora Studio - Photo Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121a;color:#f4f5fa;font-family:Arial,sans-serif}
header{padding:16px 20px;background:#191c27;border-bottom:1px solid #303443;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:bold;color:#a99bff}
button,.btn,select,input{font:inherit}
button,.btn{background:#292e3d;color:white;border:1px solid #42485b;padding:10px 13px;border-radius:9px;cursor:pointer}
button:hover,.btn:hover{background:#414967}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#7059dc;border-color:#7059dc}
.danger{background:#873e4b}
input[type=file]{display:none}
.app{display:grid;grid-template-columns:220px minmax(250px,1fr) 285px;min-height:calc(100vh - 65px)}
.sidebar,.right{background:#191c27;padding:15px;overflow:auto}
.sidebar{border-right:1px solid #303443}
.right{border-left:1px solid #303443}
h3{font-size:14px;color:#b9b2e8;margin:18px 0 10px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{font-size:12px;padding:12px 5px}
.workspace{padding:16px;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.stage{flex:1;min-height:400px;background:#0b0d12;border:1px dashed #444b60;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas{max-width:100%;max-height:75vh;object-fit:contain;touch-action:none}
.empty{text-align:center;color:#a6a9b8;padding:20px}
.control{margin:13px 0}
.control label{display:flex;justify-content:space-between;font-size:12px;color:#c4c6d1;margin-bottom:7px}
input[type=range]{width:100%;accent-color:#a99bff}
input[type=color]{width:100%;height:35px;background:none;border:0}
input[type=text],input[type=number],select,textarea{width:100%;background:#10131d;color:white;border:1px solid #3b4154;border-radius:8px;padding:10px}
textarea{min-height:75px;resize:vertical}
.panel{border-bottom:1px solid #303443;padding-bottom:14px}
.layer{display:flex;justify-content:space-between;align-items:center;gap:5px;background:#252a38;padding:8px;border-radius:8px;margin:6px 0;font-size:12px}
.layer button{padding:5px 8px}
.small{font-size:11px;color:#9fa4b6;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.status{font-size:12px;color:#a9a1e8;margin-top:8px;min-height:18px}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar,.right{border:0;border-bottom:1px solid #303443}.sidebar{order:1}.workspace{order:2;min-height:500px}.right{order:3}.stage{min-height:350px}canvas{max-height:60vh}}
</style>
</head>
<body>
<header>
  <div class="logo">✦ EDITORA STUDIO</div>
  <div class="toolbar" style="margin:0">
    <label class="btn primary" for="upload">＋ Upload Photo</label>
    <input id="upload" type="file" accept="image/*">
    <button id="undo">↶ Undo</button>
    <button id="redo">↷ Redo</button>
    <button id="reset">Reset</button>
    <button id="saveProject">Save Project</button>
    <button id="openProject">Open Project</button>
    <button id="export" class="primary">Export Photo</button>
  </div>
</header>

<div class="app">
<aside class="sidebar">
  <h3>PHOTO TOOLS</h3>
  <div class="tools">
    <button data-tool="adjust">Adjust</button>
    <button data-tool="filters">Filters</button>
    <button data-tool="effects">Effects</button>
    <button data-tool="crop">Crop & Size</button>
    <button data-tool="draw">Brush & Eraser</button>
    <button data-tool="text">Add Text</button>
    <button data-tool="stickers">Stickers</button>
    <button data-tool="background">Background</button>
    <button data-tool="layers">Layers</button>
    <button data-tool="color">Color</button>
    <button data-tool="ai">AI Studio</button>
    <button data-tool="export">Export</button>
  </div>
  <h3>QUICK ACTIONS</h3>
  <div class="tools">
    <button id="rotateL">↶ Rotate</button>
    <button id="rotateR">↷ Rotate</button>
    <button id="flipH">↔ Flip H</button>
    <button id="flipV">↕ Flip V</button>
    <button id="before">Before</button>
    <button id="after">After</button>
  </div>
  <p class="small">Editora Studio • Browser-based photo editing</p>
</aside>

<main class="workspace">
  <div class="toolbar">
    <button id="fit">Fit to Screen</button>
    <button id="zoomIn">＋ Zoom</button>
    <button id="zoomOut">－ Zoom</button>
    <button id="clearSelection">Clear Selection</button>
  </div>
  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <h2>Start Editing Your Photo</h2>
      <p>Upload a photo to begin editing.</p>
      <label class="btn primary" for="upload">Choose Photo</label>
    </div>
    <canvas id="canvas" hidden></canvas>
  </div>
  <div class="status" id="status">Ready • Upload a photo to start.</div>
</main>

<aside class="right">
  <h3 id="panelTitle">ADJUSTMENTS</h3>
  <div id="controls">
    <p class="small">Upload a photo and select a tool.</p>
  </div>
</aside>
</div>

<script>
(() => {
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let photo=null,original=null,tool='adjust',zoom=1,history=[],future=[];
let S={brightness:100,contrast:100,saturation:100,warmth:0,hue:0,blur:0,opacity:100,
  exposure:0,sharpness:0,filter:'Original',rotation:0,flipH:false,flipV:false,
  texts:[],stickers:[],strokes:[],bg:'#ffffff',crop:null};
let drawing=false,last=null,showOriginal=false;

function msg(t){$('status').textContent=t}
function clone(x){return JSON.parse(JSON.stringify(x))}
function snapshot(){
 if(!photo)return;
 history.push({S:clone(S)});
 if(history.length>40)history.shift();
 future=[];
}
function restore(obj){S=clone(obj.S);draw();render()}
function undo(){if(!history.length)return;future.push({S:clone(S)});restore(history.pop());msg('Undo complete')}
function redo(){if(!future.length)return;history.push({S:clone(S)});restore(future.pop());msg('Redo complete')}

function loadImage(src){
 const im=new Image();
 im.onload=()=>{
  photo=im;original=im;
  canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;
  S={brightness:100,contrast:100,saturation:100,warmth:0,hue:0,blur:0,opacity:100,exposure:0,sharpness:0,filter:'Original',rotation:0,flipH:false,flipV:false,texts:[],stickers:[],strokes:[],bg:'#ffffff',crop:null};
  history=[];future=[];
  $('empty').hidden=true;canvas.hidden=false;
  draw();render();msg('Photo loaded successfully');
 };
 im.src=src;
}

$('upload').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;

  if (!f.type.startsWith('image/')) {
    msg('Please select a valid image');
    e.target.value = '';
    return;
  }

  const r = new FileReader();

  r.onload = () => {
    loadImage(r.result);
  };

  r.onerror = () => {
    msg('Image file could not be read');
  };

  r.readAsDataURL(f);
};
  

function draw(){
 if(!photo)return;
 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);
 ctx.save();
 ctx.fillStyle=S.bg;ctx.fillRect(0,0,w,h);
 if(showOriginal){
  ctx.drawImage(original,0,0,w,h);ctx.restore();return;
 }
 ctx.filter=`brightness(${S.brightness}%) contrast(${S.contrast}%) saturate(${S.saturation}%) hue-rotate(${S.hue}deg) blur(${S.blur}px)`;
 ctx.globalAlpha=S.opacity/100;
 ctx.save();ctx.translate(w/2,h/2);
 ctx.scale(S.flipH?-1:1,S.flipV?-1:1);
 ctx.rotate(S.rotation*Math.PI/180);
 let dw=(S.rotation%180===0)?w:h,dh=(S.rotation%180===0)?h:w;
 ctx.drawImage(photo,-dw/2,-dh/2,dw,dh);
 ctx.restore();ctx.filter='none';ctx.globalAlpha=1;
 // Warm/cool tint and exposure overlay
 if(S.warmth!==0){ctx.fillStyle=S.warmth>0?`rgba(255,145,40,${Math.abs(S.warmth)/500})`:`rgba(40,130,255,${Math.abs(S.warmth)/500})`;ctx.fillRect(0,0,w,h)}
 if(S.exposure!==0){ctx.fillStyle=S.exposure>0?`rgba(255,255,255,${S.exposure/300})`:`rgba(0,0,0,${Math.abs(S.exposure)/300})`;ctx.fillRect(0,0,w,h)}
 // Drawing strokes
 for(const s of S.strokes){
  if(s.visible===false||s.points.length<1)continue;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=s.size;ctx.strokeStyle=s.color;
  ctx.globalCompositeOperation=s.mode==='eraser'?'destination-out':'source-over';
  ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
  s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
  if(s.points.length===1){ctx.lineTo(s.points[0].x+.1,s.points[0].y+.1)}
  ctx.stroke();ctx.restore();
 }
 // Stickers
 S.stickers.forEach(o=>{
  if(o.visible===false)return;
  ctx.save();ctx.font=`${o.size}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(o.value,o.x,o.y);ctx.restore();
 });
 // Text
 S.texts.forEach(o=>{
  if(o.visible===false)return;
  ctx.save();ctx.font=`${o.weight||'bold'} ${o.size}px ${o.font||'Arial'}`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(o.stroke){ctx.lineWidth=3;ctx.strokeStyle=o.stroke;ctx.strokeText(o.value,o.x,o.y)}
  ctx.fillStyle=o.color;ctx.fillText(o.value,o.x,o.y);ctx.restore();
 });
 ctx.restore();
}

function slider(label,key,min,max,step=1,suffix=''){
 return `<div class="control"><label>${label}<span id="v_${key}">${S[key]}${suffix}</span></label>
 <input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${S[key]}"></div>`;
}
function render(){
 const c=$('controls');$('panelTitle').textContent=tool.toUpperCase();
 if(!photo){c.innerHTML='<p class="small">Upload a photo first.</p>';return}
 if(tool==='adjust'){
 c.innerHTML=slider('Brightness','brightness',0,200)+''
 +slider('Contrast','contrast',0,200)+slider('Saturation','saturation',0,200)
 +slider('Warmth','warmth',-100,100)+slider('Hue','hue',-180,180,'1','°')
 +slider('Blur','blur',0,20)+slider('Exposure','exposure',-100,100)
 +slider('Opacity','opacity',0,100,1,'%');
 }else if(tool==='filters'){
 const names=['Original','Grayscale','Sepia','Vintage','Cool','Warm','Dramatic','Fade','Noir','Bright'];
 c.innerHTML='<p class="small">Choose a filter preset.</p><div class="grid2">'+names.map(n=>`<button data-filter="${n}">${n}</button>`).join('')+'</div>';
 }else if(tool==='effects'){
 c.innerHTML=slider('Blur','blur',0,20)+slider('Vignette (preview)','exposure',-100,100)
 +'<p class="small">Vignette and advanced effects can be added in later engine upgrades.</p>';
 }else if(tool==='crop'){
 c.innerHTML=`<p class="small">Crop using the preset sizes below. This changes the canvas dimensions.</p>
 <div class="grid2">${['Original','Square','4:5','3:2','16:9','9:16'].map(x=>`<button data-crop="${x}">${x}</button>`).join('')}</div>
 <div class="control"><label>Custom width</label><input id="cw" type="number" min="1" placeholder="Width"></div>
 <div class="control"><label>Custom height</label><input id="ch" type="number" min="1" placeholder="Height"></div>
 <button id="customResize" class="primary">Resize Canvas</button>`;
 }else if(tool==='draw'){
 c.innerHTML=`<div class="grid2"><button data-draw="brush">Brush</button><button data-draw="eraser">Eraser</button></div>
 <div class="control"><label>Brush color</label><input type="color" id="brushColor" value="#ffffff"></div>
 <div class="control"><label>Brush size</label><input type="range" id="brushSize" min="1" max="100" value="8"></div>
 <p class="small">Draw directly on the photo. Eraser removes brush marks and underlying photo pixels in its path.</p>
 <button id="clearDraw" class="danger">Clear All Drawing</button>`;
 }else if(tool==='text'){
 c.innerHTML=`<div class="control"><label>Text</label><input id="textValue" placeholder="Write your text"></div>
 <div class="control"><label>Font size</label><input id="textSize" type="number" value="48" min="8" max="300"></div>
 <div class="control"><label>Text color</label><input id="textColor" type="color" value="#ffffff"></div>
 <div class="control"><label>Font family</label><select id="textFont"><option>Arial</option><option>Georgia</option><option>Impact</option><option>Verdana</option><option>Courier New</option></select></div>
 <button id="addText" class="primary">Add Text</button>`;
 }else if(tool==='stickers'){
 c.innerHTML='<p class="small">Add a sticker to your photo.</p><div class="grid2">'+['❤️','⭐','✨','🔥','🌸','🌈','🎉','☀️','🌙','💎','🌺','🎯'].map(x=>`<button data-sticker="${x}" style="font-size:22px">${x}</button>`).join('')+'</div>';
 }else if(tool==='background'){
 c.innerHTML=`<p class="small">Choose a canvas color. This appears behind transparent parts of an image. It does not automatically remove a photo background.</p>
 <input type="color" id="bgColor" value="${S.bg}">
 <button id="applyBg">Apply Background</button>`;
 }else if(tool==='layers'){
 c.innerHTML='<p class="small">Manage text, stickers and drawing layers.</p>'+
 layerList('Text',S.texts,'text')+layerList('Stickers',S.stickers,'sticker')+layerList('Drawing',S.strokes,'stroke');
 }else if(tool==='color'){
 c.innerHTML=slider('Brightness','brightness',0,200)+slider('Contrast','contrast',0,200)+slider('Saturation','saturation',0,200)+slider('Warmth','warmth',-100,100);
 }else if(tool==='ai'){
 c.innerHTML=`<h3>AI PHOTO STUDIO</h3>
 <p class="small">These tools need a connected AI image-editing service and API key. They are not active until integration.</p>
 <div class="control"><label>Prompt to Edit</label><textarea id="prompt" placeholder="Describe the changes you want..."></textarea></div>
 <button disabled>Generate AI Edit — API required</button>
 <hr><button disabled>Remove Background — API required</button>
 <button disabled>Remove Object — API required</button>
 <button disabled>AI Enhance — API required</button>
 <button disabled>Upscale Image — API required</button>
 <p class="small">Do not enter private information into an unconnected or untrusted AI service.</p>`;
 }else if(tool==='export'){
 c.innerHTML=`<p class="small">Export your edited image.</p>
 <div class="control"><label>Format</label><select id="format"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select></div>
 <div class="control"><label>Quality</label><input type="range" id="quality" min="10" max="100" value="92"></div>
 <button id="download" class="primary">Download Photo</button>`;
 }
 wire();
}
function layerList(title,arr,type){
 return `<h3>${title}</h3>`+(arr.length?arr.map((o,i)=>`<div class="layer">
 <span>${type==='text'?o.value:type==='sticker'?o.value:'Stroke '+(i+1)}</span>
 <button data-vis="${type}:${i}">${o.visible===false?'Show':'Hide'}</button>
 <button data-del="${type}:${i}">✕</button></div>`).join(''):'<p class="small">No layers yet.</p>');
}
function wire(){
 document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{
  S[el.dataset.key]=Number(el.value);
  const v=$('v_'+el.dataset.key);if(v)v.textContent=el.value;
  draw();
 });
 document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{
  snapshot();const f=el.dataset.filter;S.filter=f;
  const vals={Original:[100,100,100,0],Grayscale:[100,110,0,0],Sepia:[105,90,75,20],Vintage:[110,85,80,15],Cool:[105,105,110,-25],Warm:[110,105,115,30],Dramatic:[105,140,120,-5],Fade:[115,80,90,5],Noir:[100,145,0,0],Bright:[130,105,110,0]}[f];
  [S.brightness,S.contrast,S.saturation,S.warmth]=vals;draw();render();
 });
 document.querySelectorAll('[data-crop]').forEach(el=>el.onclick=()=>crop(el.dataset.crop));
 document.querySelectorAll('[data-draw]').forEach(el=>el.onclick=()=>{tool='draw';drawMode=el.dataset.draw;msg('Selected '+drawMode);render()});
 document.querySelectorAll('[data-sticker]').forEach(el=>el.onclick=()=>{snapshot();S.stickers.push({value:el.dataset.sticker,x:canvas.width/2,y:canvas.height/2,size:70,visible:true});draw();render()});
 document.querySelectorAll('[data-vis]').forEach(el=>el.onclick=()=>{
  snapshot();const [t,i]=el.dataset.vis.split(':');const a=t==='text'?S.texts:t==='sticker'?S.stickers:S.strokes;a[i].visible=a[i].visible===false?true:false;draw();render();
 });
 document.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
  snapshot();const [t,i]=el.dataset.del.split(':');const a=t==='text'?S.texts:t==='sticker'?S.stickers:S.strokes;a.splice(i,1);draw();render();
 });
 if($('addText'))$('addText').onclick=()=>{
  const value=$('textValue').value;if(!value.trim())return;
  snapshot();S.texts.push({value,x:canvas.width/2,y:canvas.height/2,size:Number($('textSize').value)||48,color:$('textColor').value,font:$('textFont').value,weight:'bold',visible:true});draw();render();
 };
 if($('brushColor'))$('brushColor').oninput=e=>brushColor=e.target.value;
 if($('brushSize'))$('brushSize').oninput=e=>brushSize=Number(e.target.value);
 if($('clearDraw'))$('clearDraw').onclick=()=>{snapshot();S.strokes=[];draw();render()};
 if($('bgColor'))$('bgColor').oninput=e=>pendingBg=e.target.value;
 if($('applyBg'))$('applyBg').onclick=()=>{snapshot();S.bg=pendingBg||$('bgColor').value;draw()};
 if($('customResize'))$('customResize').onclick=()=>resize(Number($('cw').value),Number($('ch').value));
 if($('download'))$('download').onclick=download;
}
let drawMode='brush',brushColor='#ffffff',brushSize=8,pendingBg='#ffffff';
function crop(r){
 let w=canvas.width,h=canvas.height,ratio;
 if(r==='Original')return;
 if(r==='Square')ratio=1;
 if(r==='4:5')ratio=4/5;
 if(r==='3:2')ratio=3/2;
 if(r==='16:9')ratio=16/9;
 if(r==='9:16')ratio=9/16;
 snapshot();
 let nw=w,nh=h;
 if(w/h>ratio)nw=Math.round(h*ratio);else nh=Math.round(w/ratio);
 const x=Math.round((w-nw)/2),y=Math.round((h-nh)/2);
 const temp=document.createElement('canvas');temp.width=nw;temp.height=nh;
 temp.getContext('2d').drawImage(canvas,x,y,nw,nh,0,0,nw,nh);
 loadEditedCanvas(temp);msg('Crop applied');
}
function resize(w,h){
 if(!w||!h||w<1||h<1||w>8000||h>8000)return msg('Enter valid dimensions (max 8000)');
 snapshot();const temp=document.createElement('canvas');temp.width=w;temp.height=h;
 temp.getContext('2d').drawImage(canvas,0,0,w,h);loadEditedCanvas(temp);
}
function loadEditedCanvas(temp){
 const im=new Image();im.onload=()=>{photo=im;original=im;canvas.width=temp.width;canvas.height=temp.height;
 S.texts=[];S.stickers=[];S.strokes=[];draw();render()};im.src=temp.toDataURL();
}
function point(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
canvas.addEventListener('pointerdown',e=>{
 if(!photo||tool!=='draw')return;
 snapshot();drawing=true;last=point(e);
 S.strokes.push({points:[last],color:brushColor,size:brushSize,mode:drawMode,visible:true});
 canvas.setPointerCapture(e.pointerId);draw();
});
canvas.addEventListener('pointermove',e=>{
 if(!drawing)return;const p=point(e);
 S.strokes[S.strokes.length-1].points.push(p);last=p;draw();
});
function stop(){drawing=false;last=null}
canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);

$('undo').onclick=undo;$('redo').onclick=redo;
$('reset').onclick=()=>{
 if(!original)return;snapshot();photo=original;
 S={brightness:100,contrast:100,saturation:100,warmth:0,hue:0,blur:0,opacity:100,exposure:0,sharpness:0,filter:'Original',rotation:0,flipH:false,flipV:false,texts:[],stickers:[],strokes:[],bg:'#ffffff',crop:null};
 canvas.width=original.naturalWidth;canvas.height=original.naturalHeight;draw();render();msg('Photo reset');
};
$('rotateL').onclick=()=>{snapshot();S.rotation=(S.rotation-90+360)%360;draw()};
$('rotateR').onclick=()=>{snapshot();S.rotation=(S.rotation+90)%360;draw()};
$('flipH').onclick=()=>{snapshot();S.flipH=!S.flipH;draw()};
$('flipV').onclick=()=>{snapshot();S.flipV=!S.flipV;draw()};
$('before').onclick=()=>{showOriginal=true;draw()};
$('after').onclick=()=>{showOriginal=false;draw()};
$('fit').onclick=()=>{zoom=1;canvas.style.transform='scale(1)'};
$('zoomIn').onclick=()=>{zoom=Math.min(zoom+.1,2);canvas.style.transform=`scale(${zoom})`};
$('zoomOut').onclick=()=>{zoom=Math.max(.3,zoom-.1);canvas.style.transform=`scale(${zoom})`};
$('clearSelection').onclick=()=>msg('Selection cleared');


document.querySelectorAll('[data-tool]').forEach(el=>{
  el.onclick=()=>{
    tool=el.dataset.tool;
    render();
    msg(tool.toUpperCase()+' tool selected');
  };
});

function download(){
  if(!photo)return msg('Upload a photo first');
  const format=$('format')?.value||'png';
  const quality=Number($('quality')?.value||92)/100;
  const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';
  const link=document.createElement('a');
  link.download='editora-photo.'+(format==='jpeg'?'jpg':format);
  link.href=canvas.toDataURL(mime,quality);
  link.click();
  msg('Photo exported successfully');
}

$('export').onclick=()=>{
  tool='export';
  render();
};

$('saveProject').onclick=()=>{
  if(!photo)return msg('Upload a photo first');
  try{
    const project={
      image:canvas.toDataURL('image/png'),
      settings:S
    };
    localStorage.setItem('editoraProject',JSON.stringify(project));
    msg('Project saved on this device');
  }catch(e){
    msg('Project could not be saved. Image may be too large.');
  }
};

$('openProject').onclick=()=>{
  const saved=localStorage.getItem('editoraProject');
  if(!saved)return msg('No saved project found');
  try{
    const project=JSON.parse(saved);
    loadImage(project.image);
    const restoreSettings=()=>{
      if(!photo)return;
      S=project.settings;
      draw();
      render();
      msg('Project opened successfully');
    };
    const im=new Image();
    im.onload=()=>{
      photo=im;
      original=im;
      canvas.width=im.naturalWidth;
      canvas.height=im.naturalHeight;
      $('empty').hidden=true;
      canvas.hidden=false;
      restoreSettings();
    };
    im.src=project.image;
  }catch(e){
    msg('Could not open saved project');
  }
};

render();
})();
</script>
</body>
</html>
